[project]
name = "cernus"
version = "0.1.0"
description = "Cernus — runtime security and continuous assurance. This is a meta-package: install cernus-cli (this package depends on it)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Inceptium", email = "opensource@inceptium.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["cernus-cli>=0.1.0"]

[project.urls]
Homepage = "https://github.com/Inceptium-ai/cernus-framework"
Repository = "https://github.com/Inceptium-ai/cernus-framework"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cernus"]
