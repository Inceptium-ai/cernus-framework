[project]
name = "cernus-cli"
version = "0.1.0"
description = "cernus — ingest scanner output and Genesis evidence into one normalized runtime-security model; scan with the tools you already have; export SARIF and OSCAL."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Inceptium", email = "opensource@inceptium.ai" }]
keywords = ["devsecops", "vulnerability-management", "compliance", "oscal", "sbom", "fedramp", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "cernus-core>=0.1.0",
    "cernus-plugins>=0.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
cernus = "cernus_cli.main:main"

[project.urls]
Homepage = "https://github.com/Inceptium-ai/cernus-framework"
Repository = "https://github.com/Inceptium-ai/cernus-framework"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cernus_cli"]
